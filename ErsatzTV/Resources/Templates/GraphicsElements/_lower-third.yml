name: Animated Lower Third
html: |
  <!DOCTYPE html>
  <html>
  <head>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .lt {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 1.1rem 1.4rem;
        color: #fff;
        background: linear-gradient(90deg, rgba(0,0,0,0.82), rgba(0,0,0,0.35));
        border-left: 6px solid #e8b84a;
        box-sizing: border-box;
        animation: slide-in 0.7s ease-out both, pulse 2.4s ease-in-out 0.7s infinite;
      }
      .title {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.15;
        text-shadow: 0 2px 8px rgba(0,0,0,0.55);
      }
      .subtitle {
        margin-top: 0.35rem;
        font-size: 1.05rem;
        opacity: 0.9;
      }
      @keyframes slide-in {
        from { transform: translateX(-110%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { border-left-color: #e8b84a; }
        50% { border-left-color: #ffd97a; }
      }
    </style>
  </head>
  <body>
    <div class="lt">
      <div class="title">{{ MediaItem_Title }}</div>
      <div class="subtitle">Now Playing</div>
    </div>
  </body>
  </html>
location: BottomLeft
horizontal_margin_percent: 4
vertical_margin_percent: 6
width_percent: 48
height_percent: 18
opacity_percent: 100
z_index: 20
capture_fps: 30
start_seconds: 0
duration_seconds: 12
epg_entries: 0
